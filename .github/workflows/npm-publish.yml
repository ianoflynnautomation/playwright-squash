name: Publish to npm

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    if: github.repository == 'ianoflynnautomation/playwright-squash'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@11.21.1

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run smoke
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$tag" != "$version" ]; then
            echo "::error title=npm::tag v${tag} does not match package.json ${version}"
            exit 1
          fi
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "::notice title=npm::${name}@${version} is already published — skipping"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            unset NODE_AUTH_TOKEN
            # setup-node writes `_authToken=${NODE_AUTH_TOKEN}`. An empty token
            # counts as configured auth, and npm then skips the OIDC exchange.
            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            if [ -f "$npmrc" ]; then
              sed -i '/_authToken/d' "$npmrc"
            fi
            echo "Publishing ${name}@${version} with trusted publishing."
          else
            echo "Publishing ${name}@${version} with NPM_TOKEN."
          fi
          npm publish --provenance --access public
